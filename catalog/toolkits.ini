# Toolbelt — tool catalog
#
# Sections: [category <id>] and [toolkit <id>]. One key=value per line.
# `toolbelt` validates this file on every load.
#
# Tools live in tools/<category>/<id>/ and the category field names that
# directory, so the tree is the taxonomy: tools/net/..., tools/efml/...

[category net]
zh=网络
en=Network
icon=🌐
blurb=端口扫描、连通性探测

[category reverse]
zh=逆向
en=Reverse engineering
icon=🔍
blurb=ELF / 固件镜像分析

[category efml]
zh=EFML 容器
en=EFML containers
icon=🧩
blurb=夭折的 EFML4A 项目留下的 .ab / LZ4 工具

[category android]
zh=Android 构建
en=Android build
icon=📱
blurb=Gradle 构建与 APK 检查

[category toolchain]
zh=构建工具链
en=Build toolchain
icon=🛠
blurb=JDK / Android SDK / 编译器的安装与体检

[category termux]
zh=Termux 环境
en=Termux environment
icon=⌨
blurb=Android/Termux 环境检查

[toolkit portscan]
category=net
name=portscan
language=Bash
license=MPL-2.0
status=active
path=tools/net/portscan
entry=tools/net/portscan/run.sh
tags=network,tcp,termux
usage=toolbelt run portscan -- 192.168.1.1 1-1024 --jobs 128
zh=并行 TCP 端口扫描：纯 bash + /dev/tcp，主机、端口区间、并发度全部参数化
en=Parallel TCP port scan in pure bash over /dev/tcp; host, port range and concurrency are arguments

[toolkit a64elf]
category=reverse
name=a64elf
language=C
license=MPL-2.0
status=active
path=tools/reverse/a64elf
entry=tools/reverse/a64elf/run.sh
tags=arm64,elf,reverse,firmware
usage=toolbelt run a64elf -- list   # then: toolbelt run a64elf -- findptr image.bin 0x12345678
zh=ARM64 镜像 / ELF 分析小工具集：ADRP 交叉引用、指针表、函数图谱、字符串扫描等 15 个独立命令
en=Fifteen standalone ARM64 image/ELF analysis commands: ADRP xrefs, pointer tables, function maps, string scans

[toolkit ab-header]
category=efml
name=ab-header
language=C
license=MPL-2.0
status=active
path=tools/efml/ab-header
entry=tools/efml/ab-header/run.sh
tags=efml,ab,container,reverse
usage=toolbelt run ab-header -- bundle.ab
zh=校验并解扰 EFML4A .ab 的 48 字节头：自检、compBI/uncompBI/size/flags/encFlags、块信息与数据起始偏移
en=Verify and unscramble an EFML4A .ab header: self-check, compBI/uncompBI/size/flags/encFlags, block-info and data offsets

[toolkit lz4-block]
category=efml
name=lz4-block
language=C
license=MPL-2.0
status=active
path=tools/efml/lz4-block
entry=tools/efml/lz4-block/run.sh
tags=efml,lz4,compression
usage=toolbelt run lz4-block -- block.bin out.bin 131072 --inv
zh=解码单个 LZ4 块：标准小端 offset 与数据块用的大端 offset（LZ4Inv）两种变体，带 --selftest
en=Decode one raw LZ4 block, standard or the big-endian-offset inverted variant (LZ4Inv), with --selftest

[toolkit android-build]
category=android
name=android-build
language=Bash
license=MPL-2.0
status=active
path=tools/android/android-build
entry=tools/android/android-build/run.sh
tags=android,gradle,build
usage=toolbelt run android-build -- ~/jmc/JMNeXt --variant release
zh=从终端构建 Android/Gradle 工程：检测 JDK 与 SDK、跑 assemble<Variant>、报告新产物的尺寸与 SHA-256，可选 adb 安装
en=Build a Gradle Android project from the terminal: detect the JDK and SDK, run assemble<Variant>, report new APK size and SHA-256, optionally adb install

