# Toolbelt — tool catalog
#
# Sections: [category <id>] and [toolkit <id>]. One key=value per line.
# `toolbelt` validates this file on every load.
#
# Tools live in tools/<category>/<id>/ and the category field names that
# directory, so the tree is the taxonomy: tools/net/ports, tools/android/...

[category net]
zh=网络
en=Network
icon=🌐
blurb=端口扫描、连通性探测

[category reverse]
zh=逆向
en=Reverse engineering
icon=🔍
blurb=ELF / 固件镜像分析

[category android]
zh=Android 构建
en=Android build
icon=📱
blurb=Gradle 构建与 APK 检查

[category termux]
zh=Termux 环境
en=Termux environment
icon=⌨
blurb=Android/Termux 环境检查

[toolkit portscan]
category=net
name=portscan
language=Bash
license=MPL-2.0
status=active
path=tools/net/portscan
entry=tools/net/portscan/run.sh
tags=network,tcp,termux
usage=toolbelt run portscan -- 192.168.1.1 1-1024 --jobs 128
zh=并行 TCP 端口扫描：纯 bash + /dev/tcp，主机、端口区间、并发度全部参数化
en=Parallel TCP port scan in pure bash over /dev/tcp; host, port range and concurrency are arguments

[toolkit a64elf]
category=reverse
name=a64elf
language=C
license=MPL-2.0
status=active
path=tools/reverse/a64elf
entry=tools/reverse/a64elf/run.sh
tags=arm64,elf,reverse,firmware
usage=toolbelt run a64elf -- list   # then: toolbelt run a64elf -- findptr image.bin 0x12345678
zh=ARM64 镜像 / ELF 分析小工具集：ADRP 交叉引用、指针表、函数图谱、字符串扫描等 15 个独立命令
en=Fifteen standalone ARM64 image/ELF analysis commands: ADRP xrefs, pointer tables, function maps, string scans

[toolkit android-build]
category=android
name=android-build
language=Bash
license=MPL-2.0
status=active
path=tools/android/android-build
entry=tools/android/android-build/run.sh
tags=android,gradle,build
usage=toolbelt run android-build -- ~/jmc/JMNeXt --variant release
zh=从终端构建 Android/Gradle 工程：检测 JDK 与 SDK、跑 assemble<Variant>、报告新产物的尺寸与 SHA-256，可选 adb 安装
en=Build a Gradle Android project from the terminal: detect the JDK and SDK, run assemble<Variant>, report new APK size and SHA-256, optionally adb install

[toolkit apk-info]
category=android
name=apk-info
language=Bash
license=MPL-2.0
status=active
path=tools/android/apk-info
entry=tools/android/apk-info/run.sh
tags=android,apk,inspect
usage=toolbelt run apk-info -- app-release.apk
zh=检查 APK：大小、SHA-256、原生 ABI、v1 签名痕迹；有 aapt2/aapt 时再输出包名、版本与启动 Activity
en=Inspect an APK: size, SHA-256, native ABIs and v1 signature evidence, plus package identity when aapt2/aapt is available

[toolkit termux-doctor]
category=termux
name=termux-doctor
language=Bash
license=MPL-2.0
status=active
path=tools/termux/termux-doctor
entry=tools/termux/termux-doctor/run.sh
tags=termux,android,environment
usage=toolbelt run termux-doctor
zh=检查 Termux/Android 环境：link(2) 限制、Node 堆、locale、存储权限、adb/JDK/Android SDK
en=Check a Termux/Android environment: link(2) limits, Node heap, locale, storage permissions, adb/JDK/Android SDK
